global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rfid-ops.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: rfid-operations-console
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:28080"]
        labels:
          environment: production-like
